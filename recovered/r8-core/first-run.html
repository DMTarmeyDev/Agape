<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Cache-Control" content="no-store">
<title>DMT Core First Run Test</title>
<style>
:root{font-family:Inter,Segoe UI,system-ui,sans-serif;color-scheme:dark;background:#07101d;color:#e8eef7}*{box-sizing:border-box}body{margin:0;background:#07101d}.wrap{max-width:1050px;margin:auto;padding:28px}.head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:22px}.head h1{margin:0;font-size:30px}.head p{color:#9eafc5;margin:7px 0 0}.badge{padding:9px 13px;border:1px solid #334155;border-radius:999px;background:#101c2d;font-weight:700}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.card{border:1px solid #2a3b50;border-radius:12px;padding:15px;background:#0d1828}.card h3{font-size:14px;color:#a9b8cb;margin:0 0 8px}.result{font-size:21px;font-weight:800}.pass{color:#86efac}.fail{color:#fca5a5}.wait{color:#fde68a}.actions{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}.btn{border:1px solid #3b4c63;border-radius:9px;background:#14243a;color:#eef4fc;padding:10px 14px;cursor:pointer;text-decoration:none}.btn.primary{background:#1d4ed8;border-color:#3b82f6}pre{background:#050c16;border:1px solid #26364a;border-radius:10px;padding:14px;white-space:pre-wrap;word-break:break-word;max-height:420px;overflow:auto}.summary{font-size:18px;margin:18px 0}.foot{color:#92a3b9;margin-top:18px}.okbox{border-color:#166534}.badbox{border-color:#991b1b}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><div><h1>DMT Core — System + Project Loop Test</h1><p>This test verifies Core, Templates 1/2, local AI routing, and the bounded Project Loop installation preflight.</p></div><div id="build" class="badge">Checking...</div></div>
  <div id="summary" class="summary wait">Running installation checks...</div>
  <div id="cards" class="grid"></div>
  <div class="actions"><button id="again" class="btn">Run test again</button><a href="/" class="btn primary">Open DMT Core</a></div>
  <pre id="details">Loading...</pre>
  <div class="foot">The legacy R-series installation is not imported into this Core installation.</div>
</div>
<script src="/api/security/bootstrap.js"></script>
<script>
(async()=>{
'use strict';
const NS='dmt-core-v1.3.1-first-run';
if(localStorage.getItem(NS)!=='1'){
  try{localStorage.clear();sessionStorage.clear()}catch(_){}
  try{if(window.caches){for(const k of await caches.keys())await caches.delete(k)}}catch(_){}
  localStorage.setItem(NS,'1');
}
const names={source_manifest:'Source integrity',database_integrity:'Database integrity',clean_data_lineage:'Clean isolated database',templates_installed:'Templates 1 + 2 installed',session_security:'Local session security',windows_powershell:'PowerShell backend',ollama_service:'Ollama service',preferred_model:'Fast tool model',isolated_install_preflight:'Isolated real AI→terminal proof',template_1_preflight:'Template 1 isolated preflight',template_2_preflight:'Template 2 isolated preflight',project_loop_storage:'Project Loop database storage',project_loop_auto_model:'Project Loop Auto Model',project_loop_preflight:'Project Loop isolated preflight'};
async function run(){
  document.getElementById('summary').className='summary wait';document.getElementById('summary').textContent='Running installation checks...';
  const r=await fetch('/api/system-test?x='+Date.now(),{cache:'no-store'});const d=await r.json();
  document.getElementById('build').textContent=d.build||'unknown build';
  const cards=document.getElementById('cards');cards.innerHTML='';
  for(const [k,label] of Object.entries(names)){
    const ok=!!(d.checks&&d.checks[k]);const c=document.createElement('div');c.className='card '+(ok?'okbox':'badbox');
    c.innerHTML='<h3>'+label+'</h3><div class="result '+(ok?'pass':'fail')+'">'+(ok?'PASS':'FAIL')+'</div>';cards.appendChild(c);
  }
  const ok=d.overall==='PASS';const s=document.getElementById('summary');s.className='summary '+(ok?'pass':'fail');s.textContent=ok?('SYSTEM TEST PASS — '+d.passed+'/'+d.total+' checks passed'):('SYSTEM TEST FAIL — '+d.passed+'/'+d.total+' checks passed. Failed: '+(d.failed||[]).join(', '));
  document.getElementById('details').textContent=JSON.stringify(d,null,2);
}
document.getElementById('again').onclick=()=>run().catch(e=>{document.getElementById('summary').className='summary fail';document.getElementById('summary').textContent='TEST ERROR: '+e.message});
try{await run()}catch(e){document.getElementById('summary').className='summary fail';document.getElementById('summary').textContent='TEST ERROR: '+e.message;document.getElementById('details').textContent=String(e)}
})();
</script>
</body>
</html>
